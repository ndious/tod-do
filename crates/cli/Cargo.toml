[package]
name = "cli"
description = "A git-native todo CLI: one branch, one context, one file per task"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tod"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
dot = { path = "../dot" }

[dev-dependencies]
tempfile.workspace = true
