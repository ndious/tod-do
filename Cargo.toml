[workspace]
resolver = "2"
members = ["crates/dot", "crates/cli", "crates/server", "crates/server/migration", "crates/web"]
default-members = ["crates/dot", "crates/cli", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tempfile = "3"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
rusqlite = { version = "0.31", features = ["bundled"] }
argon2 = "0.5"
rand = "0.8"
yew = { version = "0.21", features = ["csr"] }
loco-rs = "1.2"
gloo-net = { version = "0.5", features = ["json"] }
wasm-bindgen-futures = "0.4"

[profile.release]
strip = true
lto = true
